name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.7.1

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Inputs-Viewer-iOS
          path: ${{ steps.build.outputs.build-output }}
