name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.7.1
          target: iOS

      - name: Inspect build output
        run: |
          echo "=== BUILD OUTPUT ==="
          echo "${{ steps.build.outputs.build-output }}"
          echo "=== FILE TYPE ==="
          file "${{ steps.build.outputs.build-output }}"
          echo "=== FILE SIZE ==="
          ls -lh "${{ steps.build.outputs.build-output }}"

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Inputs-Viewer-iOS
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
